name: Daily ETF Update

on:
  schedule:
    # UTC 10:17 = 台灣時間 18:17（週一～五）
    - cron: '17 10 * * 1-5'
    # UTC 11:43 = 台灣時間 19:43（週一～五）
    - cron: '43 11 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 urllib3

      - name: Run tracker script
        run: python tracker_00981A.py && python tracker_00403A.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "🤖 Daily update $(TZ=Asia/Taipei date +'%Y-%m-%d %H:%M')"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
